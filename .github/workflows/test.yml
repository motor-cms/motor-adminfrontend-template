name: Tests & Coverage

on:
  push:
    branches: [develop, staging, production]
  pull_request:
    branches: [develop, staging, production]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    # Skip bot commits (version bumps, merge-downs)
    if: >-
      github.event_name == 'pull_request' ||
      (
        !startsWith(github.event.head_commit.message, 'chore: version packages') &&
        !startsWith(github.event.head_commit.message, 'Merge remote-tracking branch')
      )

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')),null,2))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
