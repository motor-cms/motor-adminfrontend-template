name: Auto Changeset

on:
  push:
    branches: [production]
    paths:
      - 'layers/*/app/**'
      - 'layers/*/server/**'

jobs:
  auto-changeset:
    name: Generate changeset from commits
    runs-on: ubuntu-latest

    # Skip commits made by this workflow or changesets action
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: version packages') &&
      !startsWith(github.event.head_commit.message, 'chore(changeset):')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing changesets
        id: check
        run: |
          CHANGESET_FILES=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -n "$CHANGESET_FILES" ]; then
            echo "has_changeset=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changeset=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type from commit messages
        if: steps.check.outputs.has_changeset == 'false'
        id: bump
        run: |
          # Get commits since last version tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --)
          else
            COMMITS=$(git log -5 --pretty=format:"%s" --)
          fi

          BUMP="patch"
          SUMMARY=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue

            # Check for breaking changes
            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              BUMP="major"
              SUMMARY="${SUMMARY}- ${msg}\n"
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              [ "$BUMP" != "major" ] && BUMP="minor"
              SUMMARY="${SUMMARY}- ${msg}\n"
            elif echo "$msg" | grep -qE '^(fix|refactor|perf)(\(.+\))?:'; then
              SUMMARY="${SUMMARY}- ${msg}\n"
            fi
          done <<< "$COMMITS"

          # Fallback summary if no conventional commits matched
          if [ -z "$SUMMARY" ]; then
            SUMMARY="- $(git log -1 --pretty=format:'%s')\n"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          # Write summary to a file to preserve newlines
          printf '%b' "$SUMMARY" > /tmp/changeset-summary.txt

      - name: Create changeset file
        if: steps.check.outputs.has_changeset == 'false'
        run: |
          BUMP="${{ steps.bump.outputs.bump }}"
          SUMMARY=$(cat /tmp/changeset-summary.txt)

          # Generate a short unique name
          HASH=$(git rev-parse --short HEAD)
          FILENAME=".changeset/auto-${HASH}.md"

          cat > "$FILENAME" << EOF
          ---
          '@motor-cms/ui-core': ${BUMP}
          '@motor-cms/ui-admin': ${BUMP}
          '@motor-cms/ui-media': ${BUMP}
          ---

          ${SUMMARY}
          EOF

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' "$FILENAME"

          echo "Created $FILENAME:"
          cat "$FILENAME"

      - name: Commit and push changeset
        if: steps.check.outputs.has_changeset == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore(changeset): auto-generate from conventional commits"
          git push
