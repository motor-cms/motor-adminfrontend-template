name: Merge Down

on:
  push:
    branches: [production, staging]

jobs:
  merge-down:
    name: Cascade merge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge production → staging
        id: to-staging
        if: github.ref_name == 'production'
        run: |
          git checkout staging
          git merge origin/production --no-edit 2>&1 && MERGED=true || MERGED=false

          if [ "$MERGED" = "true" ]; then
            git push origin staging
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            # Auto-resolve version file conflicts: keep staging's versions
            VERSION_FILES="layers/*/package.json package.json pnpm-lock.yaml .changeset/pre.json CHANGELOG.md"
            HAS_VERSION_CONFLICT=false

            for pattern in $VERSION_FILES; do
              for file in $pattern; do
                if git diff --name-only --diff-filter=U | grep -q "^${file}$"; then
                  echo "Auto-resolving conflict in $file (keeping ours)"
                  git checkout --ours "$file"
                  git add "$file"
                  HAS_VERSION_CONFLICT=true
                fi
              done
            done

            # Check if there are still unresolved conflicts (code conflicts)
            REMAINING=$(git diff --name-only --diff-filter=U | head -1)
            if [ -n "$REMAINING" ]; then
              echo "result=conflict" >> "$GITHUB_OUTPUT"
              git merge --abort
            elif [ "$HAS_VERSION_CONFLICT" = "true" ]; then
              # All conflicts were version files — auto-resolved
              pnpm install --lockfile-only 2>/dev/null || true
              git add pnpm-lock.yaml 2>/dev/null || true
              git commit --no-edit
              git push origin staging
              echo "result=merged" >> "$GITHUB_OUTPUT"
            else
              echo "result=conflict" >> "$GITHUB_OUTPUT"
              git merge --abort
            fi
          fi

      - name: Open PR on production → staging conflict
        if: github.ref_name == 'production' && steps.to-staging.outputs.result == 'conflict'
        run: |
          EXISTING=$(gh pr list --base staging --head production --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create --base staging --head production \
              --title "Merge production → staging" \
              --body "Automatic merge-down could not fast-forward. Version conflicts were auto-resolved but code conflicts remain. Please resolve and merge manually."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge staging → develop
        id: to-develop
        if: always() && (github.ref_name == 'staging' || steps.to-staging.outputs.result == 'merged')
        run: |
          git fetch origin staging develop
          git checkout develop
          git merge origin/staging --no-edit 2>&1 && MERGED=true || MERGED=false

          if [ "$MERGED" = "true" ]; then
            git push origin develop
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            # Auto-resolve version file conflicts: keep develop's versions
            VERSION_FILES="layers/*/package.json package.json pnpm-lock.yaml .changeset/pre.json CHANGELOG.md"
            HAS_VERSION_CONFLICT=false

            for pattern in $VERSION_FILES; do
              for file in $pattern; do
                if git diff --name-only --diff-filter=U | grep -q "^${file}$"; then
                  echo "Auto-resolving conflict in $file (keeping ours)"
                  git checkout --ours "$file"
                  git add "$file"
                  HAS_VERSION_CONFLICT=true
                fi
              done
            done

            REMAINING=$(git diff --name-only --diff-filter=U | head -1)
            if [ -n "$REMAINING" ]; then
              echo "result=conflict" >> "$GITHUB_OUTPUT"
              git merge --abort
            elif [ "$HAS_VERSION_CONFLICT" = "true" ]; then
              pnpm install --lockfile-only 2>/dev/null || true
              git add pnpm-lock.yaml 2>/dev/null || true
              git commit --no-edit
              git push origin develop
              echo "result=merged" >> "$GITHUB_OUTPUT"
            else
              echo "result=conflict" >> "$GITHUB_OUTPUT"
              git merge --abort
            fi
          fi

      - name: Open PR on staging → develop conflict
        if: always() && steps.to-develop.outputs.result == 'conflict'
        run: |
          EXISTING=$(gh pr list --base develop --head staging --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create --base develop --head staging \
              --title "Merge staging → develop" \
              --body "Automatic merge-down could not fast-forward. Version conflicts were auto-resolved but code conflicts remain. Please resolve and merge manually."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
