name: Release (Pre-release)

on:
  push:
    branches: [staging, develop]
  workflow_dispatch:

concurrency:
  group: release-prerelease-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write   # git push version bump / tags (GITHUB_TOKEN)
  id-token: write   # OIDC -> Infisical for the npm publish token (no stored NPM_TOKEN)

jobs:
  prerelease:
    name: Publish Pre-release
    runs-on: ubuntu-latest

    # Skip bot commits (merge-downs, version bumps)
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: version packages') &&
      !startsWith(github.event.head_commit.message, 'Merge remote-tracking branch')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # --- Decide whether to release ---
      # Release when an author-written changeset exists OR when layer code
      # changed without one (e.g. a merge from production). The latter lets
      # us cut a fresh pre-release even when no changeset was committed.
      - name: Check for changesets
        id: changesets
        run: |
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -n "$CHANGESETS" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if layer code changed
        if: steps.changesets.outputs.has_changesets == 'false'
        id: code_changed
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            DIFF_REF="$LAST_TAG"
          else
            DIFF_REF="HEAD~5"
          fi
          CODE_CHANGED=false
          if git diff --name-only "$DIFF_REF"..HEAD -- 'layers/' | grep -q .; then
            CODE_CHANGED=true
          fi
          echo "changed=$CODE_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.changesets.outputs.has_changesets == 'false' && steps.code_changed.outputs.changed != 'true'
        run: echo "No changesets and no layer code changes. Nothing to publish."

      - name: Determine pre-release tag
        if: steps.changesets.outputs.has_changesets == 'true' || steps.code_changed.outputs.changed == 'true'
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          fi

      # Synthesize a changeset from conventional-commit messages when layer
      # code changed but no changeset was committed. Bump level is inferred:
      # `!`/`BREAKING CHANGE` -> major, `feat` -> minor, otherwise patch.
      - name: Generate changeset from commits
        if: steps.changesets.outputs.has_changesets == 'false' && steps.code_changed.outputs.changed == 'true'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges --)
            FULL_COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%B" --no-merges --)
          else
            COMMITS=$(git log -10 --pretty=format:"%s" --no-merges --)
            FULL_COMMITS=$(git log -10 --pretty=format:"%B" --no-merges --)
          fi

          BUMP="patch"
          SUMMARY=""

          if echo "$FULL_COMMITS" | grep -qE '^BREAKING CHANGE:'; then
            BUMP="major"
          fi

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              BUMP="major"
              SUMMARY="${SUMMARY}- ${msg}\n"
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              [ "$BUMP" != "major" ] && BUMP="minor"
              SUMMARY="${SUMMARY}- ${msg}\n"
            elif echo "$msg" | grep -qE '^(fix|refactor|perf)(\(.+\))?:'; then
              SUMMARY="${SUMMARY}- ${msg}\n"
            fi
          done <<< "$COMMITS"

          if [ -z "$SUMMARY" ]; then
            SUMMARY="- $(git log -1 --pretty=format:'%s')\n"
          fi

          HASH=$(git rev-parse --short HEAD)
          FILENAME=".changeset/auto-${HASH}.md"
          printf -- "---\n" > "$FILENAME"
          printf "'@motor-cms/ui-core': %s\n" "$BUMP" >> "$FILENAME"
          printf "'@motor-cms/ui-admin': %s\n" "$BUMP" >> "$FILENAME"
          printf "'@motor-cms/ui-media': %s\n" "$BUMP" >> "$FILENAME"
          printf -- "---\n\n" >> "$FILENAME"
          printf '%b' "$SUMMARY" >> "$FILENAME"
          echo "Created $FILENAME with $BUMP bump:"
          cat "$FILENAME"

      - name: Configure git
        if: steps.changesets.outputs.has_changesets == 'true' || steps.code_changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Enter pre-release mode
        if: steps.changesets.outputs.has_changesets == 'true' || steps.code_changed.outputs.changed == 'true'
        run: |
          # Exit any existing pre-release mode first
          if [ -f .changeset/pre.json ]; then
            pnpm changeset pre exit || true
          fi
          pnpm changeset pre enter ${{ steps.tag.outputs.tag }}
          # Clear consumed changesets so they get re-processed with the new tag
          if [ -f .changeset/pre.json ]; then
            node -e "
              const fs = require('fs');
              const f = '.changeset/pre.json';
              try {
                const p = JSON.parse(fs.readFileSync(f, 'utf8'));
                p.changesets = [];
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
              } catch (e) {
                console.error('Failed to clear changesets:', e.message);
                process.exit(1);
              }
            "
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true' || steps.code_changed.outputs.changed == 'true'
        id: version
        run: |
          pnpm changeset version
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      # Direct `pnpm publish` per package. We avoid `pnpm changeset publish`
      # because the changesets/pnpm-11/npm-10.9 combo silently returns
      # "E404 undefined". `pnpm publish` (unlike vanilla `npm publish`)
      # resolves the `workspace:^` peer dependency on @motor-cms/ui-core to a
      # concrete caret range before publishing.
      - name: Fetch npm token from Infisical (OIDC, no stored token)
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          domain: https://secrets.tastatur-und-maus.net
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
        # exports NPM_TOKEN to the job env for the publish step
      - name: Publish to npm
        if: steps.version.outputs.versioned == 'true'
        id: publish
        run: |
          set -e
          FAILED=()
          for pkg in layers/motor-ui-core layers/motor-ui-admin layers/motor-ui-media; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            echo "::group::Publishing $NAME@$VERSION (tag: ${{ steps.tag.outputs.tag }})"
            if ( cd "$pkg" && pnpm publish --access public --tag ${{ steps.tag.outputs.tag }} --no-git-checks ); then
              echo "✓ $NAME@$VERSION"
            else
              echo "✗ $NAME@$VERSION failed"
              FAILED+=("$NAME@$VERSION")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Packages failed to publish: ${FAILED[*]}"
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Commit version updates
        if: steps.publish.outputs.published == 'true'
        run: |
          pnpm install --lockfile-only || echo "::warning::Failed to update lockfile"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages (${{ steps.tag.outputs.tag }})"
            git push || { echo "::error::Failed to push version commit"; exit 1; }
          fi
