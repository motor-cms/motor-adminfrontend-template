name: Release (Pre-release)

on:
  push:
    branches: [staging, develop]
  workflow_dispatch:

concurrency:
  group: release-prerelease-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write   # git push version bump / tags (GITHUB_TOKEN)
  id-token: write   # OIDC -> Infisical for the npm publish token (no stored NPM_TOKEN)

jobs:
  prerelease:
    name: Publish Pre-release
    runs-on: ubuntu-latest

    # Skip bot commits (merge-downs, version bumps)
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: version packages') &&
      !startsWith(github.event.head_commit.message, 'Merge remote-tracking branch')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check for changesets
        id: changesets
        run: |
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -n "$CHANGESETS" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no changesets
        if: steps.changesets.outputs.has_changesets == 'false'
        run: echo "No changesets to publish. Skipping."

      - name: Configure git
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine pre-release tag
        if: steps.changesets.outputs.has_changesets == 'true'
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: Enter pre-release mode
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          # Exit any existing pre-release mode first
          if [ -f .changeset/pre.json ]; then
            pnpm changeset pre exit || true
          fi
          pnpm changeset pre enter ${{ steps.tag.outputs.tag }}
          # Clear consumed changesets so they get re-processed with the new tag
          if [ -f .changeset/pre.json ]; then
            node -e "
              const fs = require('fs');
              const f = '.changeset/pre.json';
              try {
                const p = JSON.parse(fs.readFileSync(f, 'utf8'));
                p.changesets = [];
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
              } catch (e) {
                console.error('Failed to clear changesets:', e.message);
                process.exit(1);
              }
            "
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm changeset version

      - name: Fetch npm token from Infisical (OIDC, no stored token)
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          domain: https://secrets.tastatur-und-maus.net
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
        # exports NPM_TOKEN to the job env for the publish step
      - name: Publish to npm
        if: steps.changesets.outputs.has_changesets == 'true'
        id: publish
        run: |
          pnpm changeset publish
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Commit version updates
        if: steps.publish.outputs.published == 'true'
        run: |
          pnpm install --lockfile-only || echo "::warning::Failed to update lockfile"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages (${{ steps.tag.outputs.tag }})"
            git push || { echo "::error::Failed to push version commit"; exit 1; }
          fi
