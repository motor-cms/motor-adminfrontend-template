name: Release

on:
  push:
    branches: [staging, develop]

jobs:
  snapshot:
    name: Snapshot Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Determine snapshot tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish snapshot
        run: |
          pnpm changeset version --snapshot ${{ steps.tag.outputs.tag }}
          pnpm changeset publish --tag ${{ steps.tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # No commit — snapshots don't modify the branch.
        # This prevents merge conflicts in git-flow merge-down.
