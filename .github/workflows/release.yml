name: Release

on:
  push:
    branches: [production, staging, develop]

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Exit pre-release mode
        if: github.ref_name == 'production'
        run: |
          if [ -f .changeset/pre.json ]; then
            pnpm changeset pre exit
          fi

      - name: Version packages (production)
        if: github.ref_name == 'production'
        run: pnpm changeset version

      - name: Publish to npm (production)
        if: github.ref_name == 'production'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Enter RC pre-release mode
        if: github.ref_name == 'staging'
        run: |
          if [ -f .changeset/pre.json ]; then
            pnpm changeset pre exit
          fi
          pnpm changeset pre enter rc

      - name: Version packages (staging)
        if: github.ref_name == 'staging'
        run: pnpm changeset version

      - name: Publish to npm (staging)
        if: github.ref_name == 'staging'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Enter alpha pre-release mode
        if: github.ref_name == 'develop'
        run: |
          if [ -f .changeset/pre.json ]; then
            pnpm changeset pre exit
          fi
          pnpm changeset pre enter alpha

      - name: Version packages (develop)
        if: github.ref_name == 'develop'
        run: pnpm changeset version

      - name: Publish to npm (develop)
        if: github.ref_name == 'develop'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push version updates
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages"
            git push
          fi
