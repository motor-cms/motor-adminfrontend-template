name: Release (Production)

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write   # git push version bump + gh release create (GITHUB_TOKEN)
  id-token: write   # OIDC -> Infisical for the npm publish token (no stored NPM_TOKEN)

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest

    # Skip bot commits (version bumps, merge-downs)
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: version packages') &&
      !startsWith(github.event.head_commit.message, 'Merge remote-tracking branch')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # --- Auto-generate changeset if missing ---
      - name: Check for changesets
        id: check
        run: |
          CHANGESET_FILES=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -n "$CHANGESET_FILES" ]; then
            echo "has_changeset=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changeset=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if code files changed
        if: steps.check.outputs.has_changeset == 'false'
        id: code_changed
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            DIFF_REF="$LAST_TAG"
          else
            DIFF_REF="HEAD~5"
          fi

          CODE_CHANGED=false
          if git diff --name-only "$DIFF_REF"..HEAD -- 'layers/' | grep -q .; then
            CODE_CHANGED=true
          fi
          echo "changed=$CODE_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Generate changeset from commits
        if: steps.check.outputs.has_changeset == 'false' && steps.code_changed.outputs.changed == 'true'
        run: |
          # Get commits since last version tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges --)
            FULL_COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%B" --no-merges --)
          else
            COMMITS=$(git log -10 --pretty=format:"%s" --no-merges --)
            FULL_COMMITS=$(git log -10 --pretty=format:"%B" --no-merges --)
          fi

          BUMP="patch"
          SUMMARY=""

          # Check full commit bodies for BREAKING CHANGE
          if echo "$FULL_COMMITS" | grep -qE '^BREAKING CHANGE:'; then
            BUMP="major"
          fi

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue

            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              BUMP="major"
              SUMMARY="${SUMMARY}- ${msg}\n"
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              [ "$BUMP" != "major" ] && BUMP="minor"
              SUMMARY="${SUMMARY}- ${msg}\n"
            elif echo "$msg" | grep -qE '^(fix|refactor|perf)(\(.+\))?:'; then
              SUMMARY="${SUMMARY}- ${msg}\n"
            fi
          done <<< "$COMMITS"

          # Fallback summary
          if [ -z "$SUMMARY" ]; then
            SUMMARY="- $(git log -1 --pretty=format:'%s')\n"
          fi

          HASH=$(git rev-parse --short HEAD)
          FILENAME=".changeset/auto-${HASH}.md"

          printf -- "---\n" > "$FILENAME"
          printf "'@motor-cms/ui-core': %s\n" "$BUMP" >> "$FILENAME"
          printf "'@motor-cms/ui-admin': %s\n" "$BUMP" >> "$FILENAME"
          printf "'@motor-cms/ui-media': %s\n" "$BUMP" >> "$FILENAME"
          printf -- "---\n\n" >> "$FILENAME"
          printf '%b' "$SUMMARY" >> "$FILENAME"

          echo "Created $FILENAME with $BUMP bump:"
          cat "$FILENAME"
          echo "has_changeset=true" >> "$GITHUB_OUTPUT"

      # --- Version, publish, commit ---
      - name: Version packages
        if: steps.check.outputs.has_changeset == 'true' || steps.code_changed.outputs.changed == 'true'
        id: version
        run: |
          pnpm changeset version
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      # Direct npm publish loop. We bypass `pnpm changeset publish` here
      # because the changesets/pnpm-11/npm-10.9 combo silently returns
      # "E404 undefined" — changeset reads json.error.summary from npm's
      # --json output and finds it missing. Vanilla `npm publish` works
      # fine with the exact same token+registry+package state.
      - name: Fetch npm token from Infisical (OIDC, no stored token)
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          domain: https://secrets.tastatur-und-maus.net
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
        # exports NPM_TOKEN to the job env for the publish step
      - name: Publish to npm
        if: steps.version.outputs.versioned == 'true'
        id: publish
        run: |
          set -e
          FAILED=()
          for pkg in layers/motor-ui-core layers/motor-ui-admin layers/motor-ui-media; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            echo "::group::Publishing $NAME@$VERSION"
            if ( cd "$pkg" && npm publish --access public --tag latest ); then
              echo "✓ $NAME@$VERSION"
            else
              echo "✗ $NAME@$VERSION failed"
              FAILED+=("$NAME@$VERSION")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Packages failed to publish: ${FAILED[*]}"
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Commit and push version bump
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: version packages"
            git push || { echo "::error::Failed to push version commit"; exit 1; }
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub releases
        if: steps.publish.outputs.published == 'true'
        run: |
          for pkg in layers/motor-ui-core layers/motor-ui-admin layers/motor-ui-media; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            TAG="${NAME}@${VERSION}"
            gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
